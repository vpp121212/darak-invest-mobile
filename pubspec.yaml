name: darak_wa_hayk
description: دارك وحيك - منصة عقارية ذكية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  intl: ^0.20.2
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  share_plus: ^7.2.1
  webview_flutter: ^4.4.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#05060A"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#05060A"
  image: "assets/icons/app_icon_fg.png"
  android: true
  ios: true
  android_12:
    color: "#05060A"
    image: "assets/icons/app_icon_fg.png"
