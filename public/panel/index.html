<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دارك — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060a;--c:#0d0f17;--c2:#12141f;--g:#d4af37;--g2:#f0d878;--t:#f5f5f7;--m:#9fa3b7;--b:rgba(255,255,255,.08);--r:16px;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#26293a;border-radius:99px}

/* ===== login ===== */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#login:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -20%,rgba(212,175,55,.14),transparent 60%)}
.lg-logo{width:92px;height:92px;border-radius:26px;background:linear-gradient(135deg,#d4af37,#8a6d1d);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#05060a;box-shadow:0 10px 40px rgba(212,175,55,.35);position:relative;z-index:1}
.lg-name{margin-top:18px;font-size:26px;font-weight:900;letter-spacing:-.5px;position:relative;z-index:1}
.lg-sub{margin-top:6px;font-size:13px;color:var(--m);position:relative;z-index:1}
.lg-card{margin-top:30px;width:100%;max-width:360px;background:var(--c);border:1px solid var(--b);border-radius:20px;padding:24px;position:relative;z-index:1}
.lg-field{margin-bottom:14px}
.lg-field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}
.lg-field input{width:100%;height:48px;background:#0a0c13;border:1px solid var(--b);border-radius:12px;padding:0 14px;color:var(--t);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.lg-field input:focus{border-color:var(--g)}
.lg-btn{width:100%;height:50px;border-radius:14px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#05060a;font-weight:800;font-size:15px;margin-top:6px;transition:.2s}
.lg-btn:active{transform:scale(.98)}
.lg-foot{margin-top:16px;text-align:center;font-size:11px;color:var(--m)}
.lg-foot b{color:var(--g)}
.lg-hint{margin-top:12px;padding:10px 12px;border:1px dashed rgba(212,175,55,.35);border-radius:12px;font-size:11px;color:var(--m);text-align:center;line-height:1.7;background:rgba(212,175,55,.04)}

/* ===== app shell ===== */
#app{display:flex;min-height:100vh}
#side{display:none}
#main{flex:1;min-width:0}
.m-top{position:sticky;top:0;z-index:50;background:rgba(5,6,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,.12);padding:12px 16px;display:flex;align-items:center;gap:12px}
.m-top .brand{display:flex;align-items:center;gap:10px}
.m-top .brand .lo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#d4af37,#8a6d1d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#05060a}
.m-top .brand .bn{font-weight:800;font-size:15px}
.m-top .brand .bs{font-size:10px;color:var(--g)}
.m-burger{width:40px;height:40px;border-radius:12px;background:var(--c);border:1px solid var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.m-burger i{width:16px;height:2px;background:var(--t);border-radius:2px;display:block}
.m-top .sp{flex:1}
.m-user{display:flex;align-items:center;gap:10px}
.m-user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2a2e45,#1a1d2b);border:2px solid rgba(212,175,55,.4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--g2)}
.m-user .un{display:none;font-size:12px;font-weight:700}
.m-user .ur{font-size:10px;color:var(--m)}

/* content */
.cont{max-width:1100px;margin:0 auto;padding:16px 16px 100px}
.page-title{font-size:20px;font-weight:900;margin-bottom:4px}
.page-sub{font-size:12px;color:var(--m);margin-bottom:16px}
.grid{display:grid;gap:12px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;top:-30px;left:-30px;width:90px;height:90px;border-radius:50%;background:rgba(212,175,55,.08)}
.kpi .ic{font-size:20px;margin-bottom:8px}
.kpi .vl{font-size:20px;font-weight:900}
.kpi .lb{font-size:11px;color:var(--m);margin-top:2px}
.kpi .dl{font-size:10px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px}
.kpi .up{color:var(--green);background:rgba(74,222,128,.1)}
.kpi .down{color:var(--red);background:rgba(248,113,113,.1)}

/* card / section */
.sec{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h .tt{font-weight:800;font-size:14px}
.sec-h .ln{font-size:11px;color:var(--g);font-weight:700;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:none}
.row .rt{font-size:12px;font-weight:700;flex:1}
.row .rs{font-size:10px;color:var(--m)}
.row .rv{font-size:12px;font-weight:800;color:var(--g2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:800;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,#d4af37,#b8941f);color:#05060a}
.btn-ghost{background:var(--c2);border:1px solid var(--b);color:var(--t)}
.btn-red{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.btn-sm{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.btn-icon{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}

/* fab */
.fab{position:fixed;bottom:24px;left:24px;z-index:60;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#d4af37,#b8941f);color:#05060a;font-size:26px;font-weight:800;box-shadow:0 8px 30px rgba(212,175,55,.4);display:flex;align-items:center;justify-content:center}

/* search + chips */
.search{display:flex;align-items:center;gap:10px;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:0 14px;height:48px;margin-bottom:12px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--t);font-family:inherit;font-size:14px;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 16px;border-radius:99px;background:var(--c);border:1px solid var(--b);font-size:12px;font-weight:700;color:var(--m);transition:.15s}
.chip.on{background:rgba(212,175,55,.15);border-color:rgba(212,175,55,.5);color:var(--g2)}

/* property card */
.p-card{display:flex;gap:12px;background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:12px;margin-bottom:10px}
.p-thumb{width:96px;height:92px;border-radius:12px;overflow:hidden;flex-shrink:0;position:relative}
.p-thumb img{width:100%;height:100%;object-fit:cover}
.p-thumb .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#1a1e30,#0d101a)}
.p-badge{position:absolute;top:6px;right:6px;font-size:9px;font-weight:800;padding:2px 8px;border-radius:99px;backdrop-filter:blur(4px)}
.pb-sale{background:rgba(74,222,128,.2);color:#4ade80}
.pb-rent{background:rgba(96,165,250,.2);color:#60a5fa}
.pb-feat{position:absolute;top:6px;left:6px;font-size:11px}
.p-info{flex:1;min-width:0}
.p-title{font-size:13px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-loc{font-size:10px;color:var(--m);margin-bottom:5px}
.p-price{font-size:15px;font-weight:900;color:var(--g2);margin-bottom:4px}
.p-meta{display:flex;gap:10px;font-size:10px;color:var(--m)}
.p-actions{display:flex;gap:6px;margin-top:8px}

/* stats charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:8px 0}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars .bar .col{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,rgba(212,175,55,.85),rgba(212,175,55,.35));transition:.3s;min-height:3px}
.bars .bar.alt .col{background:linear-gradient(180deg,rgba(96,165,250,.85),rgba(96,165,250,.3))}
.bars .bar .bl{font-size:9px;color:var(--m)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--m);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:right;font-size:10px;color:var(--m);padding:8px;border-bottom:1px solid var(--b);font-weight:700}
.tbl td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
.tbl tr:last-child td{border-bottom:none}
.tbl .t-gold{color:var(--g2);font-weight:800}
.tbl .t-green{color:var(--green);font-weight:700}
.tbl .t-red{color:var(--red);font-weight:700}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill-new{background:rgba(96,165,250,.15);color:var(--blue)}
.pill-done{background:rgba(74,222,128,.12);color:var(--green)}
.pill-wait{background:rgba(212,175,55,.14);color:var(--g2)}

/* inquiry */
.msg{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:14px;margin-bottom:10px}
.msg-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.msg-h .av{width:38px;height:38px;border-radius:50%;background:var(--c2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.msg-h .nm{font-size:13px;font-weight:800}
.msg-h .tm{font-size:10px;color:var(--m)}
.msg-b{font-size:12px;color:#cdd0dd;line-height:1.8;margin-bottom:10px}
.msg-ref{background:#0a0c13;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.msg-ref .tt{font-size:11px;font-weight:800;margin-bottom:4px}
.msg-ref .vl{font-size:11px;color:var(--m)}
.msg-a{width:100%;background:#0a0c13;border:1px solid var(--b);border-radius:12px;padding:10px 12px;color:var(--t);font-family:inherit;font-size:12px;resize:none;min-height:60px;outline:none;margin-bottom:8px}
.msg-a:focus{border-color:var(--g)}

/* content mgmt */
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--b);padding-bottom:10px;overflow-x:auto}
.tab{flex-shrink:0;font-size:13px;font-weight:800;color:var(--m);padding:8px 14px;border-radius:10px;cursor:pointer}
.tab.on{background:rgba(212,175,55,.13);color:var(--g2)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.set-row:last-child{border-bottom:none}
.set-row .st{font-size:13px;font-weight:700}
.set-row .ss{font-size:11px;color:var(--m);margin-top:2px}
.switch{width:46px;height:26px;border-radius:99px;background:#26293a;position:relative;transition:.2s;flex-shrink:0}
.switch:after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:linear-gradient(135deg,#d4af37,#b8941f)}
.switch.on:after{right:23px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,6,10,.9);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.ov.open{display:flex}
.sheet{width:100%;max-width:480px;background:#0c0e16;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet .sh .tt{font-size:16px;font-weight:900}
.sheet .sh .x{width:34px;height:34px;border-radius:10px;background:var(--c2);border:1px solid var(--b);font-size:14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-full{grid-column:1/-1}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--m);margin-bottom:6px;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#0a0c13;border:1px solid var(--b);border-radius:12px;padding:12px 14px;color:var(--t);font-family:inherit;font-size:13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g)}
.field select{appearance:none}
.feats{display:flex;flex-wrap:wrap;gap:8px}
.feat{padding:7px 14px;border-radius:99px;background:var(--c2);border:1px solid var(--b);font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.feat.on{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.5);color:var(--g2)}
.upbox{height:120px;border:2px dashed rgba(212,175,55,.35);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--m);font-size:12px;background:rgba(212,175,55,.03);cursor:pointer}
.upbox .u{font-size:26px}

/* drawer */
#dr-ov{position:fixed;inset:0;background:rgba(5,6,10,.7);z-index:300;display:none;backdrop-filter:blur(4px)}
#dr-ov.open{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;background:#0b0d15;z-index:301;transform:translateX(100%);transition:.25s ease;display:flex;flex-direction:column;border-left:1px solid var(--b)}
#drawer.open{transform:none}
.dr-head{padding:20px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px}
.dr-head .lo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#d4af37,#8a6d1d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#05060a}
.dr-head .bn{font-size:16px;font-weight:900}
.dr-head .bs{font-size:10px;color:var(--m)}
.dr-nav{flex:1;padding:14px;overflow-y:auto}
.dr-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;font-size:13px;font-weight:700;color:var(--m);cursor:pointer;margin-bottom:4px;transition:.15s}
.dr-item.on{background:rgba(212,175,55,.13);color:var(--g2)}
.dr-item .ic{font-size:17px;width:22px;text-align:center}
.dr-foot{padding:14px;border-top:1px solid var(--b)}
.dr-foot .lg{display:flex;align-items:center;gap:10px;color:var(--red);font-weight:800;font-size:13px;padding:10px}

/* desktop sidebar */
@media(min-width:1000px){
  .m-burger{display:none}
  #side{display:flex;width:250px;flex-direction:column;background:#08090f;border-left:1px solid var(--b);position:sticky;top:0;height:100vh;padding:20px 14px}
  .sd-head{display:flex;align-items:center;gap:12px;padding:6px 10px 20px}
  .sd-head .lo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#d4af37,#8a6d1d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:23px;color:#05060a}
  .sd-head .bn{font-size:17px;font-weight:900}
  .sd-head .bs{font-size:10px;color:var(--m)}
  .sd-nav{flex:1;display:flex;flex-direction:column}
  .sd-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;font-size:13px;font-weight:700;color:var(--m);cursor:pointer;margin-bottom:4px;transition:.15s}
  .sd-item:hover{background:rgba(255,255,255,.04)}
  .sd-item.on{background:rgba(212,175,55,.13);color:var(--g2)}
  .sd-item .ic{font-size:17px;width:22px;text-align:center}
  .sd-item .bd{margin-right:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:2px 8px}
  .sd-foot{border-top:1px solid var(--b);padding-top:14px}
  .sd-user{display:flex;align-items:center;gap:10px;padding:10px}
  .sd-user .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2a2e45,#1a1d2b);border:2px solid rgba(212,175,55,.4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--g2)}
  .sd-user .un{font-size:13px;font-weight:800}
  .sd-user .ur{font-size:10px;color:var(--m)}
  .cont{padding:24px 28px 40px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}

/* toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1d2b;border:1px solid rgba(212,175,55,.4);color:var(--t);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:900;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* empty */
.empty{text-align:center;padding:40px 20px;color:var(--m)}
.empty .ic{font-size:40px;margin-bottom:12px}
.empty .tt{font-weight:800;color:var(--t);margin-bottom:4px}
.empty .ss{font-size:12px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="lg-logo">د</div>
  <div class="lg-name">دارك</div>
  <div class="lg-sub">لوحة التحكم — للإدارة والمالك</div>
  <div class="lg-card">
    <div class="lg-field"><label>البريد الإلكتروني</label><input type="email" value="admin@darak.sa" id="lgEmail"></div>
    <div class="lg-field"><label>كلمة المرور</label><input type="password" value="••••••••" id="lgPass"></div>
    <button class="lg-btn" onclick="doLogin()">تسجيل الدخول</button>
    <div class="lg-hint">🔒 نموذج تصميم — اضغط "تسجيل الدخول" لاستعراض الشاشات</div>
  </div>
  <div class="lg-foot">تطبيق <b>دارك العقاري</b> — نسخة الإدارة</div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="sd-head">
      <div class="lo">د</div>
      <div><div class="bn">دارك</div><div class="bs">لوحة التحكم</div></div>
    </div>
    <div class="sd-nav" id="sdNav"></div>
    <div class="sd-foot">
      <div class="sd-user"><div class="av">ع</div><div><div class="un">عبدالله المالك</div><div class="ur">المالك</div></div></div>
    </div>
  </aside>
  <main id="main">
    <div class="m-top">
      <button class="m-burger" onclick="openDrawer()"><i></i><i></i><i></i></button>
      <div class="brand"><div class="lo">د</div><div><div class="bn">دارك</div><div class="bs">لوحة التحكم</div></div></div>
      <div class="sp"></div>
      <div class="m-user">
        <div class="un">عبدالله</div>
        <div class="av">ع</div>
      </div>
    </div>
    <div class="cont" id="content"></div>
  </main>
</div>

<div id="dr-ov" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dr-head"><div class="lo">د</div><div><div class="bn">دارك</div><div class="bs">لوحة التحكم</div></div></div>
  <div class="dr-nav" id="drNav"></div>

/* ============ helpers ============ */

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function setPF(f){pFilter=f;go('props')}
function searchProps(q){
  var list=props.filter(function(p){return pFilter==='all'||p.tp===pFilter||(pFilter==='feat'&&p.feat)});
  if(q)list=list.filter(function(p){return (p.t+' '+p.loc).indexOf(q)>-1});
  document.getElementById('pList').innerHTML=list.length?list.map(propRow).join(''):'<div class="empty"><div class="ic">🔎</div><div class="tt">لا نتائج</div></div>';
}
function delProp(id){
  if(!confirm('حذف هذا العقار نهائيًا؟'))return;
  props=props.filter(function(p){return p.id!==id});
  toast('تم حذف العقار');

}

function ctNews(){
  return news.map(function(n){
    return '<div class="sec"><div class="sec-h"><div class="tt">'+esc(n.t)+'</div>'+
      '<span class="pill '+(n.st==='منشور'?'pill-done':'pill-wait')+'">'+n.st+'</span></div>'+
      '<div style="font-size:12px;color:var(--m);line-height:1.8">'+esc(n.d)+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-sm btn-ghost" onclick="toast(\'فتح المحرر\')">✏️ تعديل</button>'+

      '<button class="btn btn-sm btn-red" onclick="toast(\'تم الحذف\')">🗑️</button></div></div>';
  }).join('')+
