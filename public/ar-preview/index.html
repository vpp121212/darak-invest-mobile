<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>دارك — معاينة AR</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
:root{--bg:#05060a;--g:#d4af37;--c:#0d0f17;--t:#f5f5f7;--m:#9fa3b7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--t)}
#scene{position:fixed;inset:0}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:10}
.top{display:flex;align-items:center;gap:10px;padding:12px;pointer-events:auto}
.title{flex:1;background:rgba(5,6,10,.78);border:1px solid rgba(212,175,55,.3);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:800;text-align:center;backdrop-filter:blur(6px)}
.ico{width:38px;height:38px;border-radius:50%;background:rgba(5,6,10,.78);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:14px;pointer-events:auto}
.panel{background:rgba(13,15,23,.92);border:1px solid rgba(212,175,55,.25);border-radius:16px;padding:14px;backdrop-filter:blur(8px)}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;line-height:1.6}
.room{margin-top:10px;padding:9px 12px;border-radius:10px;border:1px solid rgba(212,175,55,.3);background:rgba(212,175,55,.1);color:var(--g);font-size:12.5px;font-weight:800;text-align:center}
#btnStart{width:100%;margin-top:10px;height:48px;border:none;border-radius:13px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#05060a;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;pointer-events:auto}
#btnStart:active{transform:scale(.98)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .25s ease}
.hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(5,6,10,.85);border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:18px 22px;text-align:center;max-width:320px;font-size:13px;line-height:1.9;color:var(--m);display:none;z-index:30}
.hint b{color:var(--g)}
@media(min-width:768px){.panel{max-width:440px;margin:0 auto}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="fade"></div>
<div id="ui">
  <div class="top">
    <div class="title">دارك — معاينة الغرفة بتقنية الواقع المعزز</div>
    <div class="ico" id="btnReset" title="إعادة تعيين">🔄</div>
  </div>
  <div class="bottom">
    <div class="panel">
      <div class="status" id="status">🎯 وجّه الكاميرا نحو أرضية مسطحة ثم اضغط</div>
      <div class="room" id="roomLabel">جارٍ التحميل…</div>
      <button id="btnStart">🚀 ابدأ المعاينة AR</button>
    </div>
  </div>
</div>
<div class="hint" id="unsupported"><b>الواقع المعزز غير متاح على هذا الجهاز/المتصفح.</b><br>جرّب من كروم على جهاز أندرويد يدعم ARCore، أو استخدم وضع المعاينة ثلاثية الأبعاد.</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const sceneEl = document.getElementById('scene');
const statusEl = document.getElementById('status');
const roomLabelEl = document.getElementById('roomLabel');
const fadeEl = document.getElementById('fade');
const btnStart = document.getElementById('btnStart');
const btnReset = document.getElementById('btnReset');
const unsupported = document.getElementById('unsupported');

const ROOM_A = 'roomA.gltf';
const ROOM_B = 'roomB.gltf';
const ROOM_SCALE = 0.55;
const adImg = new URLSearchParams(location.search).get('img');

let renderer, scene, camera, controls, arController;
let arSupported = false, arSession = null, hitTestSource = null, referenceSpace = null;
let lastHit = null, hasHit = false;

let currentRoom = null;
let currentIdx = 0;
let busy = false;

const contents = [];
if (adImg) contents.push({ label: 'صورة العقار 🖼️', build: buildBillboard });
contents.push({ label: 'غرفة المعيشة 🏠', build: () => loadRoom(ROOM_A) });
contents.push({ label: 'غرفة النوم 🛏️', build: () => loadRoom(ROOM_B) });

function status(m){ statusEl.innerHTML = m; }
function roomLabel(){ roomLabelEl.textContent = 'المعروض الآن: ' + contents[currentIdx].label; }

function setupScene(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  sceneEl.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.0));
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(5, 10, 3);
  scene.add(dir);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = 0;
  ground.name = 'ground';
  scene.add(ground);

  const glow = new THREE.Mesh(
    new THREE.RingGeometry(0.12, 0.2, 32),
    new THREE.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
  );
  glow.rotation.x = -Math.PI/2;
  glow.visible = false;
  glow.position.y = 0.001;
  glow.name = 'glow';
  scene.add(glow);

  camera.position.set(0, 1.8, 4.2);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
}

async function loadRoom(url){
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync(url);
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const cx = (box.max.x + box.min.x)/2;
  const cy = box.min.y;
  const cz = (box.max.z + box.min.z)/2;
  model.position.set(-cx, -cy, -cz);
  model.scale.setScalar(ROOM_SCALE);
  return model;
}

async function buildBillboard(){
  const tex = await new THREE.TextureLoader().loadAsync(new URL(adImg, location.origin).href);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const i = tex.image;
  const aspect = i && i.width && i.height ? i.width/i.height : 1.6;
  const h = 1.7, w = h*aspect;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  sprite.scale.set(w, h, 1);
  sprite.position.y = h/2;
  const g = new THREE.Group();
  g.add(sprite);
  return g;
}

function placeRoom(model, position, yaw){
  currentRoom = model.clone();
  currentRoom.position.copy(position);
  currentRoom.rotation.y = yaw;
  scene.add(currentRoom);
  const glow = scene.getObjectByName('glow');
  if (glow){ glow.visible = true; glow.position.x = position.x; glow.position.z = position.z; }
}

function removeRoom(){
  if (currentRoom){ scene.remove(currentRoom); currentRoom = null; }
}

function fadeTo(target, ms){
  return new Promise(res => {
    fadeEl.style.transition = 'opacity '+ms+'ms ease';
    fadeEl.style.opacity = target;
    setTimeout(res, ms + 20);
  });
}

async function placeOrSwitch(pos, yaw){
  if (busy) return;
  busy = true;
  if (!currentRoom){
    placeRoom(contents[0].model, pos, yaw);
    currentIdx = 0;
    roomLabel();
    status('تم وضع ' + contents[0].label + ' — اضغط مرة أخرى للتبديل');
  } else {
    const nextIdx = (currentIdx + 1) % contents.length;
    const nextLabel = contents[nextIdx].label;
    await fadeTo(1, 250);
    removeRoom();
    placeRoom(contents[nextIdx].model, pos, yaw);
    currentIdx = nextIdx;
    roomLabel();
    await fadeTo(0, 250);
    status(nextLabel + ' — اضغط للتبديل إلى ' + contents[(nextIdx + 1) % contents.length].label);
  }
  busy = false;
}

async function reset(){
  if (busy) return;
  await fadeTo(1, 150);
  removeRoom();
  const glow = scene.getObjectByName('glow');
  if (glow) glow.visible = false;
  currentIdx = 0;
  roomLabel();
  await fadeTo(0, 150);
  status('وجّه الكاميرا نحو أرضية مسطحة ثم اضغط');
}
btnReset.addEventListener('click', reset);

/* ---------- Desktop / 3D preview mode ---------- */
function initDesktop(){
  btnStart.style.display = 'none';
  renderer.domElement.addEventListener('pointerdown', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - rect.left)/rect.width)*2 - 1,
      -(((e.clientY - rect.top)/rect.height)*2 - 1)
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObject(scene.getObjectByName('ground'));
    if (!hit.length) return;
    const p = hit[0].point;
    const yaw = camera.rotation.y + Math.PI;
    placeOrSwitch(p, yaw);
  });
  status('اضغط على الأرضية لوضع المحتوى، واضغط للتبديل بين الصورة والغرفتين');
}

/* ---------- AR (WebXR) mode ---------- */
function initAR(){
  btnStart.addEventListener('click', startAR);
}

async function startAR(){
  if (!arSupported){ unsupported.style.display = 'block'; return; }
  try {
    arSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('ui') }
    });
    renderer.xr.setSession(arSession);

    referenceSpace = await arSession.requestReferenceSpace('local-floor');
    const viewerSpace = await arSession.requestReferenceSpace('viewer');
    hitTestSource = await arSession.requestHitTestSource({ space: viewerSpace });

    arController = renderer.xr.getController(0);
    arController.addEventListener('select', onARSelect);
    scene.add(arController);

    status('وجّه الكاميرا نحو أرضية مسطحة، وعند ظهور الإطار الذهبي اضغط للوضع');
    btnStart.textContent = 'المعاينة تعمل الآن…';
    btnStart.style.opacity = 0.5;
    btnStart.style.pointerEvents = 'none';

    arSession.addEventListener('end', () => {
      arSession = null;
      btnStart.textContent = '🚀 ابدأ المعاينة AR';
      btnStart.style.opacity = 1;
      btnStart.style.pointerEvents = 'auto';
      removeRoom();
    });
  } catch(err){
    unsupported.innerHTML = '<b>تعذّر بدء المعاينة AR</b><br>'+esc(err.message);
    unsupported.style.display = 'block';
  }
}

function onARSelect(){
  if (busy || !hasHit) return;
  const mat = new THREE.Matrix4().fromArray(lastHit);
  const e = new THREE.Euler().setFromRotationMatrix(new THREE.Matrix4().extractRotation(mat));
  const pos = new THREE.Vector3().setFromMatrixPosition(mat);
  placeOrSwitch(pos, e.y);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- frame loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  if (renderer.xr.isPresenting){
    const frame = renderer.xr.getFrame();
    if (hitTestSource && frame){
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length){
        const pose = results[0].getPose(referenceSpace);
        if (pose){
          lastHit = pose.transform.matrix;
          hasHit = true;
          const glow = scene.getObjectByName('glow');
          if (glow && !currentRoom){
            glow.visible = true;
            glow.position.x = pose.transform.position.x;
            glow.position.z = pose.transform.position.z;
          }
        }
      } else {
        hasHit = false;
      }
    }
    renderer.render(scene, camera);
  } else {
    controls.update();
    renderer.render(scene, camera);
  }
}

/* ---------- boot ---------- */
(async () => {
  setupScene();
  for (const c of contents){ c.model = await c.build(); }
  roomLabel();
  arSupported = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false));
  if (arSupported) initAR(); else initDesktop();
  animate();
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
