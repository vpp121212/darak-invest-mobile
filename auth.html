<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دارك وحيك - المنصة العقارية الاستثمارية</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>


  <div class="app-container">
    <div class="auth-wrapper">
      
      <div class="brand-header">
        <div class="logo-icon">🏛️</div>
        <h1 class="brand-title">دارك وحيك</h1>
        <p class="brand-subtitle">استثمر في مستقبل العقار والأحياء الواعدة</p>
      </div>


      <div class="auth-card">
        <h2 id="form-title" class="form-title">تسجيل الدخول</h2>


        <div class="input-group" id="name-group" style="display: none;">
          <label for="user-name">الاسم الكامل</label>
          <input type="text" id="user-name" class="input-field" placeholder="مثال: عبد الله السلمان">
        </div>


        <div class="input-group">
          <label for="user-email">البريد الإلكتروني</label>
          <input type="email" id="user-email" class="input-field" placeholder="name@domain.com">
        </div>


        <div class="input-group">
          <label for="user-password">كلمة المرور</label>
          <input type="password" id="user-password" class="input-field" placeholder="••••••••">
        </div>


        <div id="auth-error" class="error-message"></div>


        <button id="btn-submit" class="btn-primary">دخول للمنصة</button>


        <button id="btn-toggle-mode" class="btn-secondary-link">
          ليس لديك حساب؟ <strong>إنشاء حساب جديد</strong>
        </button>
      </div>


      <div class="security-badge">
        <span>🔒 معاملات محمية وموثقة وفق أعلى المعايير المالية</span>
      </div>


    </div>
  </div>


  <script src="js/auth.js"></script>
</body>
</html>
